kind = "web"
previewPath = "/"
title = "Salon Deals"
description = "A mini Groupon-style marketplace module for salon offers, with deal discovery, purchase flow, digital vouchers, and salon-side redemption tools."
version = "1.0.0"
id = "artifacts/salon-deals"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25554

[services.development]
run = "pnpm --filter @workspace/salon-deals run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salon-deals", "run", "build" ]
serve = "static"
publicDir = "artifacts/salon-deals/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25554"
BASE_PATH = "/"
